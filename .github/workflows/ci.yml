name: CI

on:
  push:
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: kwhale
          POSTGRES_PASSWORD: kwhale_v3_pg
          POSTGRES_DB: kwhale_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kwhale -d kwhale_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check app tests
      - name: Pytest (isolated kwhale_test DB)
        env:
          KWHALE_TEST_DATABASE_URL: postgresql+asyncpg://kwhale:kwhale_v3_pg@localhost:5432/kwhale_test
          JWT_SECRET: ci-secret
          SEED_PASSWORD: ci-seed
        run: pytest -q
